<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>바람 서바이버</title>
<style>
  /* Old-client look: square bevelled wooden panels, pixel type, no soft shadows or rounded corners. */
  @font-face { font-family: G11; src: url(fonts/Galmuri11.woff2) format('woff2'); }
  @font-face { font-family: G11; font-weight: 700; src: url(fonts/Galmuri11-Bold.woff2) format('woff2'); }
  @font-face { font-family: G9; src: url(fonts/Galmuri9.woff2) format('woff2'); }
  @font-face { font-family: G7; src: url(fonts/Galmuri7.woff2) format('woff2'); }
  :root {
    --panel: #2b1d12; --panel2: #3a2818; --hi: #a07a46; --mid: #5c4228; --lo: #0d0703;
    --text: #efe3c2; --dim: #b09c78; --gold: #ffe070; --red: #ff8a6a; --sky: #a8d0ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--text);
      font: 12px/1.5 G11, monospace; -webkit-font-smoothing: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  img { image-rendering: pixelated; }
  [hidden] { display: none !important; }

  /* Windows share the side panel's materials: a carved wooden frame around parchment, dark ink,
     raised tan keys. Text that sits straight on the game view stays light with a dark edge. */
  #pause-box, #lv-box, #over-box, #sounds-box, #stage-info {
    color: #2a1606; background: #d8b070; border: 4px solid; border-color: #a0602a #2a1004 #2a1004 #a0602a;
    box-shadow: inset 0 0 0 2px #6a3a18, inset 0 0 0 3px #f0d49c, 0 0 0 1px #000; border-radius: 0; }
  .card, .choice {
    color: #2a1606; background: #e0c088; border: 2px solid; border-color: #f4dca8 #7a4a1e #7a4a1e #f4dca8; border-radius: 0; }
  #map { border: 3px solid; border-color: #a0602a #2a1004 #2a1004 #a0602a; box-shadow: 0 0 0 1px #000; }
  .btn { padding: 5px 14px; min-width: 104px; font: 700 12px/16px G11, monospace; color: #2a1606; background: #c89858;
      border: 2px solid; border-color: #e8c48c #5a3212 #5a3212 #e8c48c; }
  .btn:active, .card:active, .choice:active { border-color: #5a3212 #e8c48c #e8c48c #5a3212; }
  .btn:disabled { color: #8a6a44; background: #b08a58; }
  .caption { margin: -2px -2px 6px; padding: 2px 8px; font-weight: 700; color: #f6e6c0; background: #6a3a18;
      border-bottom: 2px solid #2a1004; text-shadow: 1px 1px 0 #2a1004; }

  .screen, #levelup, #pause, #loading { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px; padding: max(8px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .note { font: 10px/1.4 G9, monospace; color: var(--dim); text-shadow: 1px 1px 0 #000; }

  #loading .track { width: 200px; height: 10px; padding: 1px; background: var(--lo); border: 1px solid var(--hi); }
  #load-bar { height: 100%; width: 0; background: var(--gold); }

  #title h1 { margin: 0; font-size: 36px; line-height: 1.1; color: var(--gold); letter-spacing: 4px;
      text-shadow: 2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 3px 3px 0 #5a2a08; }
  #heroes { display: flex; gap: 18px; align-items: flex-end; height: 76px; }
  #heroes img { height: 92px; }

  #classes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: min(100%, 820px); }
  .card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; text-align: center; }
  .card .slot { display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 78px;
      background: url(assets/ui/wback.png) center 70% / cover; border: 1px solid; border-color: #7a4a1e #f4dca8 #f4dca8 #7a4a1e; }
  .card .hero { height: 70px; margin-bottom: 2px; }
  .card b { font-size: 14px; color: #7a1800; }
  .card span { font: 10px/1.4 G9, monospace; min-height: 4.2em; word-break: keep-all; }
  .card em { font-style: normal; font-size: 10px; font-family: G9; color: #1a4aa0; }
  .card small { font: 10px G9, monospace; color: #6a4a2a; }
  h2 { margin: 0; font-size: 14px; color: var(--gold); text-shadow: 1px 1px 0 #000; }

  .stage-wrap { display: flex; gap: 10px; align-items: stretch; justify-content: center; width: 100%; height: 100%; }
  .map-col { display: flex; flex-direction: column; gap: 4px; flex: none; }
  #map-tabs { display: flex; gap: 2px; }
  #map-tabs button { padding: 2px 10px; font-weight: 700; color: #6a4a2a; background: #b08a58;
      border: 2px solid; border-color: #d8b47c #5a3212 #5a3212 #d8b47c; }
  #map-tabs button.on { color: #2a1606; background: #d8b070; border-color: #f0d49c #5a3212 #5a3212 #f0d49c; }
  #map { position: relative; padding: 0; overflow: hidden; }
  #map img { display: block; height: calc(100vh - 52px); max-width: 56vw; object-fit: contain; }
  .pin { position: absolute; transform: translate(-50%, -100%); padding: 0; background: none; border: 0;
      display: flex; flex-direction: column; align-items: center; }
  .pin span { padding: 0 3px; font: 10px/13px G9, monospace; white-space: nowrap; color: var(--text);
      background: rgba(13, 7, 3, .82); border: 1px solid var(--mid); }
  .pin i { width: 0; height: 0; border: 5px solid transparent; border-top: 7px solid var(--gold); }
  .pin.cleared span { color: #b8f0a0; }
  .pin.locked span { color: #7a6a52; border-color: #3a2a1a; }
  .pin.locked i { border-top-color: #6a5a42; }
  .pin.on span { color: #000; background: var(--gold); border-color: #fff4c0; }
  .pin.on i { border-top-color: #fff4c0; }
  /* On the 국내성 map the caves carry their own painted labels: a marker only, named when picked. */
  /* The boss's bar under the map's name: dark wood, a red fill, the numbers on it. */
  #bossbar { position: absolute; left: 50%; top: 44px; transform: translateX(-50%); width: min(40%, 300px); z-index: 3;
      padding: 2px 6px 4px; background: #2a1408; border: 2px solid; border-color: #a0602a #2a1004 #2a1004 #a0602a;
      box-shadow: 0 0 0 1px #000; pointer-events: none; text-align: center; }
  #bossbar b { display: block; font: 700 10px/12px G11, monospace; color: #ff9a6a; text-shadow: 1px 1px 0 #000; }
  #bossbar i { position: relative; display: block; height: 6px; background: #3a0a06; border: 1px solid #000; }
  #bossbar s { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#e8402a, #a01808); }
  #bossbar span { display: block; margin-top: 1px; font: 8px G9, monospace; color: #f0d8b0; }
  /* The raid list: one carved plate per raid, its boss standing on it. */
  #map.raids { display: flex; flex-direction: column; gap: 6px; padding: 6px; background: #2a1a0c; width: min(56vw, 420px); }
  .raid { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; padding: 4px 8px; text-align: left;
      color: #2a1606; background: #e0c088; border: 2px solid; border-color: #f4dca8 #7a4a1e #7a4a1e #f4dca8; }
  .raid img { max-width: 64px; max-height: 64px; justify-self: center; image-rendering: pixelated; }
  .raid b { display: block; font: 700 13px G11, monospace; color: #7a1800; }
  .raid span { display: block; font: 10px/13px G9, monospace; }
  .raid.on { background: #fff0c0; border-color: #7a1800; }
  .raid.locked { opacity: .55; }
  #stage-info .party { font: 10px/14px G9, monospace; color: #2a5a10; }
  #map.gungnae .pin span { display: none; }
  #map.gungnae .pin.on span { display: inline; }
  #map.gungnae .pin i { border-width: 6px; border-top-width: 9px; filter: drop-shadow(0 0 1px #000); }
  .info-col { display: flex; flex-direction: column; gap: 6px; width: min(300px, 42%); justify-content: center; }
  #stage-info { padding: 0 10px 8px; }
  #stage-info h3 { margin: 0; font-size: 16px; color: #7a1800; }
  #stage-info .lv { font: 10px G9, monospace; color: #8a3a10; }
  #stage-info p { margin: 4px 0; font: 10px/1.5 G9, monospace; }
  #stage-info .mons { display: flex; gap: 8px; align-items: flex-end; height: 58px; padding: 2px 6px;
      background: #c49a62; border: 1px solid; border-color: #7a4a1e #f4dca8 #f4dca8 #7a4a1e; }
  #stage-info .mons img { max-height: 54px; }
  #stage-info .boss { margin-top: 4px; }
  #stage-info .boss b { color: #a01800; }
  #stage-info .state { font: 10px G9, monospace; color: #6a4a2a; }
  #stage-info .state.done { color: #1a6a10; }

  #levelup, #pause { background: rgba(0, 0, 0, .5); z-index: 10; }
  /* In a hunt, windows open over the play view, not over the side panel. */
  body.hunting #levelup, body.hunting #pause { right: var(--side); }
  #lv-box, #pause-box, #over-box { padding: 0 8px 8px; width: min(100%, 480px); }
  #choices { display: flex; flex-direction: column; gap: 4px; }
  .lv-keys { margin-top: 6px; }
  .lv-keys .btn { min-width: 0; flex: 1; padding: 3px 6px; font-size: 11px; }
  .choice { display: flex; align-items: center; gap: 8px; padding: 4px 8px; text-align: left; }
  .choice canvas, .choice .item { position: static; width: 40px; height: 40px; flex: none; object-fit: none;
      background: #3a2010; border: 1px solid; border-color: #7a4a1e #f4dca8 #f4dca8 #7a4a1e; }
  .choice b { font-size: 13px; color: #7a1800; }
  .choice i { font: normal 10px G9, monospace; color: #1a4aa0; }
  .choice i u { text-decoration: none; margin-left: 4px; padding: 0 4px; color: #fff; }
  .choice span { display: block; font: 10px/1.4 G9, monospace; }
  #pause-box .row { margin-top: 6px; }
  #sounds { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .6); }
  #sounds-box { width: min(96vw, 560px); max-height: 94vh; display: flex; flex-direction: column; padding: 0 8px 8px; }
  #sounds-box .caption small { font: 10px G9, monospace; color: #e8d0a0; margin-left: 6px; }
  #sound-rows { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 1fr auto; gap: 3px 8px;
      margin-bottom: 6px; touch-action: pan-y; }
  /* The town: the map is drawn on the canvas; only the labels and keys sit over it. */
  #town { pointer-events: none; justify-content: flex-start; align-items: stretch; }
  #town button { pointer-events: auto; }
  .town-top { display: flex; justify-content: space-between; padding: 2px 8px; font-weight: 700; color: #f6e6c0;
      background: rgba(30, 16, 8, .85); border: 1px solid #a0602a; align-self: center; gap: 24px; }
  #town-gold { color: #ffe070; }
  #town-back { position: absolute; left: max(8px, env(safe-area-inset-left)); bottom: 8px; min-width: 0; }
  .town-tip { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); white-space: nowrap;
      font: 10px G9, monospace; color: #f6e6c0; text-shadow: 1px 1px 0 #000;
      /* A notice line, as the client's system messages: it says its piece and goes, so it never
         sits on top of the people at the bottom of the map. */
      padding: 3px 10px; background: rgba(20, 10, 4, .75); border: 1px solid #6a3a18;
      animation: tip-out 9s forwards; pointer-events: none; }
  @keyframes tip-out { 0%, 80% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
  #town:not([hidden]) .town-tip { animation-name: tip-out; }
  #talk { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: 40px; min-width: 0; padding: 10px 16px; }
  #trade { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .6); }
  #trade-box { width: min(96vw, 520px); max-height: 92vh; display: flex; flex-direction: column; padding: 0 8px 8px;
      color: #2a1606; background: #d8b070; border: 4px solid; border-color: #a0602a #2a1004 #2a1004 #a0602a;
      box-shadow: inset 0 0 0 2px #6a3a18, inset 0 0 0 3px #f0d49c, 0 0 0 1px #000; }
  #trade-box .caption small { font: 10px G9, monospace; color: #ffe070; margin-left: 6px; }
  #trade-rows { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
  .trade-row { display: flex; align-items: center; gap: 8px; padding: 3px 6px; background: #e0c088;
      border: 2px solid; border-color: #f4dca8 #7a4a1e #7a4a1e #f4dca8; }
  .trade-row div { flex: 1; min-width: 0; }
  .trade-row b { display: block; color: #7a1800; }
  .trade-row span { display: block; font: 10px/13px G9, monospace; }
  .trade-row .btn { min-width: 72px; }
  /* The spell tree, laid out like the client's 마법 window: an icon in a sunken slot with its
     name, one chain to a line, the final spell at the right end. */
  #tree { position: fixed; inset: 0; z-index: 21; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .6); }
  #tree-box { width: min(96vw, 600px); max-height: 94vh; display: flex; flex-direction: column; padding: 0 8px 8px; color: #2a1606;
      background: #d8b070; border: 4px solid; border-color: #a0602a #2a1004 #2a1004 #a0602a;
      box-shadow: inset 0 0 0 2px #6a3a18, inset 0 0 0 3px #f0d49c, 0 0 0 1px #000; }
  #tree-box .caption small { font: 10px G9, monospace; color: #e8d0a0; margin-left: 6px; }
  #tree-rows { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  #tree-rows h4 { margin: 4px 0 0; font: 700 11px G11, monospace; color: #7a1800; }
  .chain { display: grid; grid-template-columns: 1fr 12px 1fr 18px 1fr; align-items: center; gap: 2px;
      padding: 2px; border: 1px solid transparent; }
  .chain.hot { background: #f0d8a0; border-color: #7a1800; }
  .chain > i { font: 700 12px G11, monospace; color: #6a3e16; text-align: center; font-style: normal; }
  .others { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 2px; }
  .spell { display: flex; align-items: center; gap: 4px; min-width: 0; padding: 2px; background: #e0c088;
      border: 2px solid; border-color: #7a4a1e #f4dca8 #f4dca8 #7a4a1e; }
  .spell img { flex: none; width: 28px; height: 28px; object-fit: contain; background: #1a0e06; image-rendering: pixelated; }
  .spell div { min-width: 0; font: 10px/12px G9, monospace; }
  .spell b { display: block; font: 700 11px/13px G11, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spell span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #6a3e16; }
  .spell.lock { opacity: .55; }
  .spell.have { background: #fff0c0; }
  .spell.final b { color: #7a1800; }
  #equip { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .6); }
  #equip-box { width: min(96vw, 560px); max-height: 92vh; display: flex; flex-direction: column; padding: 0 8px 8px; color: #2a1606;
      background: #d8b070; border: 4px solid; border-color: #a0602a #2a1004 #2a1004 #a0602a;
      box-shadow: inset 0 0 0 2px #6a3a18, inset 0 0 0 3px #f0d49c, 0 0 0 1px #000; }
  #equip-box .caption small { font: 10px G9, monospace; color: #e8d0a0; margin-left: 6px; }
  /* One line per kind: its name at the left, the pieces found side by side (scrolling when many). */
  #equip-rows { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 34px 1fr; gap: 4px 6px;
      align-items: center; }
  #equip-rows h4 { margin: 0; font-size: 12px; color: #7a1800; }
  .equip-row { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
  .equip { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      width: 72px; height: 58px; padding: 2px; font: 10px/12px G9, monospace; color: #2a1606; background: #e0c088;
      border: 2px solid; border-color: #f4dca8 #7a4a1e #7a4a1e #f4dca8; overflow: hidden; }
  .equip img { max-width: 40px; max-height: 36px; margin: auto 0; }
  .equip span { width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .equip.on { background: #fff0c0; border-color: #7a1800; }
  #equip-stats { margin: 6px 0; font: 10px G9, monospace; color: #6a3e16; }
  #sort { padding: 4px 0 8px; }
  .sort-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .sort-head b { font-size: 20px; color: #7a1800; min-width: 80px; }
  .sort-head span { flex: 1; font: 10px G9, monospace; color: #6a4a2a; }
  #sort-kinds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 6px; }
  #sort-kinds .btn { min-width: 0; padding: 10px 0; }
  #sound-rows h4 { grid-column: 1 / -1; margin: 6px 0 0; font-size: 12px; color: #7a1800; }
  #sound-rows span { align-self: center; }
  #sound-rows .pick { display: flex; gap: 2px; align-items: center; }
  #sound-rows .pick b { min-width: 54px; text-align: center; font: 12px G11, monospace; color: #7a1800; }
  #sound-rows .pick button { width: 30px; height: 26px; padding: 0; color: #2a1606; background: #c89858;
      border: 2px solid; border-color: #e8c48c #5a3212 #5a3212 #e8c48c; }
  #over-stats { margin: 6px 0; text-align: center; line-height: 1.7; }

  /* ---- The old client's screen: a framed play area, a carved side panel, a parchment chat. ---- */
  :root { --side: clamp(176px, 27vw, 250px); --wood: #c18a4e; --wood-hi: #e2b679; --wood-lo: #5a3212;
    --field: #e6c992; --ink: #2a1606; --frame: #8a2c10; --frame-hi: #d8743a; --frame-lo: #2a0802; }
  /* A canvas keeps its drawing size unless told its box size outright. */
  body.hunting canvas#game { width: calc(100% - var(--side)); }
  #play-frame { position: fixed; top: 0; left: 0; bottom: 0; right: var(--side); pointer-events: none; z-index: 2;
      border: 5px solid; border-color: var(--frame-hi) var(--frame-lo) var(--frame-lo) var(--frame-hi);
      box-shadow: inset 0 0 0 2px var(--frame), inset 0 0 0 3px #000; }
  #map-tab { position: absolute; top: 0; left: 50%; transform: translateX(-50%); min-width: 120px; padding: 1px 14px 2px;
      text-align: center; font-weight: 700; color: #f4e6c4; background: #1e1008; border: 1px solid var(--frame-hi);
      border-top: 0; }
  #map-tab small { display: block; font: 10px G9, monospace; color: #ffb08a; }
  #chat { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 70px; padding: 2px 6px 0; font: 10px/13px G9, monospace;
      color: var(--ink); background: #f0d9a8; border-top: 2px solid var(--frame-lo); overflow: hidden; }
  #chat::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #000; }
  #chat p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat p.sys { color: #1a2a8a; }
  #chat p.party { color: #1a6a10; }
  #chat p.warn { color: #a01800; }

  /* The side panel, drawn at the old client's own size (272 x 640, positions measured from a
     full-size capture) and scaled as a whole to the screen's height, so its proportions match. */
  #side { position: fixed; top: 0; right: 0; bottom: 0; width: var(--side); z-index: 3; overflow: hidden;
      background: #4a2810; }
  body.panel-off { --side: 0px; }
  body.panel-off #side { display: none; }
  #panel { position: absolute; left: 0; top: 0; width: 272px; height: 640px; transform-origin: 0 0; color: #2a1606;
      font: 12px/15px G11, monospace;
      background: repeating-linear-gradient(45deg, #5a3216 0 3px, #4e2a12 3px 6px); }
  #panel .scroll { position: absolute; left: 10px; top: calc(16px + var(--cut, 0px)); width: 252px; height: calc(376px - var(--cut, 0px)); border-radius: 26px / 30px;
      background: radial-gradient(ellipse at 50% 45%, #d4a868, #c08a4c 70%, #a8723a);
      box-shadow: inset 0 0 0 2px #e6c48a, inset 0 0 0 4px #8a5424, 0 0 0 2px #2a1206; }
  #panel .lbl { position: absolute; left: 18px; font: 700 14px/18px G11, monospace; color: #f6e6c0;
      text-shadow: -1px -1px 0 #7a4a1e, 1px 1px 0 #e8c890; letter-spacing: 1px; }
  #panel .fld { position: absolute; height: 18px; padding: 0 4px; overflow: hidden; white-space: nowrap; line-height: 18px;
      color: #2a1606; background: #d8b070; border: 1px solid; border-color: #8a5a2a #f0d49c #f0d49c #8a5a2a; }
  #panel .fld.r { text-align: right; }
  #panel .slot { position: absolute; width: 33px; height: 30px; display: flex; align-items: center; justify-content: center;
      background: #c89858; border: 2px solid; border-color: #e8c48c #7a4a1e #7a4a1e #e8c48c; }
  #panel .slot.dark { background: #6a4a30; border-color: #a07a50 #2a1608 #2a1608 #a07a50; }
  #panel .slot img { max-width: 28px; max-height: 26px; }
  #panel .slot b { position: absolute; right: 1px; bottom: -1px; font: 8px G7, monospace; color: #fff; text-shadow: 1px 1px 0 #000; }
  #panel .me { position: absolute; left: 108px; top: 192px; width: 52px; height: 72px; display: flex; align-items: flex-end;
      justify-content: center; }
  #panel .me img { max-width: 52px; max-height: 72px; }
  #panel .list { position: absolute; left: 18px; top: 268px; width: 208px; height: 84px; padding: 0 4px; overflow: hidden;
      background: #d8b070; border: 1px solid; border-color: #8a5a2a #f0d49c #f0d49c #8a5a2a; line-height: 16px; }
  #panel .list span { display: block; white-space: nowrap; overflow: hidden; }
  #panel .list span b { font-weight: normal; }
  #panel .bar { position: absolute; left: 228px; top: 268px; width: 18px; height: 84px; background: #c89858;
      border: 1px solid #8a5a2a; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      font: 10px/14px G9, monospace; color: #6a3e16; }
  #panel .fold { position: absolute; left: 186px; top: 356px; width: 32px; height: 20px; padding: 0; font: 12px G11, monospace;
      color: #6a3e16; background: none; border: 0; }
  #panel .msg { position: absolute; left: 6px; top: 398px; width: 258px; height: 94px; padding: 3px 6px; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end; font: 12px/14px G11, monospace; color: #5a6a8a;
      background: #dcc39a; border: 3px solid #8a2a0a; box-shadow: inset 0 0 0 1px #f4e2c0, 0 0 0 1px #d0d0d8; }
  #panel .msg p { margin: 0; flex: none; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  #panel .msg p:last-child { color: #2a2a3a; }
  #panel .em { position: absolute; left: 10px; width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font: 700 12px G11, monospace; color: #f4e2c0; text-shadow: 1px 1px 0 #000;
      overflow: hidden; background: #2a1a0e; border: 4px solid #8a6a3a;
      box-shadow: 0 0 0 1px #1a0a04, inset 0 0 0 1px #1a0a04, inset 0 0 0 3px #4a3420; }
  #panel .em img { max-width: 44px; max-height: 50px; margin-top: 8px; }
  #panel .em.coin { color: #3a2408; text-shadow: none; background: #b08a4a; border-color: #7a5a2a;
      box-shadow: 0 0 0 1px #1a0a04, inset 0 0 0 1px #e0c080, inset 0 0 0 6px #9a7438; }
  #panel .row { position: absolute; left: 80px; width: 186px; height: 20px; display: flex; align-items: center; gap: 4px;
      white-space: nowrap; color: #f0e8d8; border-bottom: 1px solid #2a1206; }
  #panel .row .k { width: 26px; flex: none; font: 10px G9, monospace; color: #d8b070; }
  #panel .row .v { flex: 1; text-align: right; }
  #panel .row.g .v { color: #b8e8a8; }
  #panel .row .gauge { position: relative; flex: 1; height: 13px; background: #000; border: 1px solid #000; }
  #panel .row .gauge i { position: absolute; left: 0; top: 0; bottom: 0; }
  #panel .row .gauge.hp i { background: linear-gradient(#f8904a, #d84a18 55%, #902008); }
  #panel .row .gauge.mp i { background: linear-gradient(#b8d0ff, #4a7ae8 55%, #1a3488); }
  #panel .row .gauge span { position: absolute; right: 3px; top: 0; line-height: 13px; color: #c8f0b8; text-shadow: 1px 1px 0 #000; }
  #panel .lvbox { padding: 0 4px; background: #000; color: #fff; }
  #panel .lv { color: #f0d890; }
  #keys { position: absolute; right: 8px; bottom: 84px; display: flex; flex-direction: column; align-items: flex-end;
      gap: 6px; pointer-events: auto; }
  #keys button { padding: 0; font: 700 12px/14px G11, monospace; color: #2a1606; background: #c89858;
      border: 2px solid; border-color: #e8c48c #5a3212 #5a3212 #e8c48c; }
  #keys button:active { border-color: #5a3212 #e8c48c #e8c48c #5a3212; }
  #pause-btn { width: 52px; height: 24px; }
  #ult { width: 92px; height: 40px; }
  #ult.ready { color: #7a1800; border-color: #fff0c0 #5a3212 #5a3212 #fff0c0; }
  #ult small { display: block; font: 8px G7, monospace; font-weight: normal; }
  /* Folded away: a tab on the frame brings it back; health and mana stay in sight under the map tab. */
  #unfold { position: absolute; right: 0; top: 30%; transform: translateY(-50%); pointer-events: auto; padding: 8px 2px;
      writing-mode: vertical-rl; font: 700 10px G9, monospace; color: #f4e6c4; background: #6a3a18;
      border: 2px solid; border-color: #a0602a #2a1004 #2a1004 #a0602a; border-right: 0; }
  #mini { position: absolute; left: 50%; top: 36px; transform: translateX(-50%); display: flex; gap: 6px;
      font: 10px G9, monospace; color: #fff; text-shadow: 1px 1px 0 #000; }
  #mini b { font-weight: normal; }
  #banner { position: fixed; top: max(22%, 86px); left: calc((100% - var(--side)) / 2); transform: translateX(-50%); padding: 3px 14px;
      font-weight: 700; color: #ffe070; background: rgba(30, 16, 8, .9); border: 1px solid var(--frame-hi);
      pointer-events: none; white-space: nowrap; z-index: 4; }
  @media (max-height: 420px) {
    .card .slot { height: 58px; }
    .card .hero { height: 52px; }
    .card span { min-height: 0; }
    .choice canvas, .choice .item { width: 34px; height: 34px; }
  }
  @media (max-width: 560px) { #classes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="loading"><div class="note">불러오는 중</div><div class="track"><div id="load-bar"></div></div></div>

<div id="title" class="screen" hidden>
  <div id="heroes"></div>
  <h1>바람 서바이버</h1>
  <div class="note">몰려오는 몬스터를 버티며 사냥터를 정복하라</div>
  <button id="start-btn" class="btn">시작</button>
  <div class="note" id="version"></div>
  <div class="note">손가락으로 끌어 이동 · 마법은 저절로 나간다 · 마력이 차면 필살기</div>
</div>

<div id="select" class="screen" hidden>
  <h2>직업 선택</h2>
  <div id="classes"></div>
  <button id="back-title" class="btn">뒤로</button>
</div>

<div id="stages" class="screen" hidden>
  <div class="stage-wrap">
    <div class="map-col">
      <div id="map-tabs"><button data-map="gungnae">국내성</button><button data-map="world_1">대륙</button><button data-map="world_4">환상의 섬</button><button data-map="raid">레이드</button></div>
      <div id="map"></div>
    </div>
    <div class="info-col">
      <div id="stage-info"></div>
      <div class="row"><button id="back-select" class="btn">직업 선택</button><button id="go" class="btn"></button></div>
    </div>
  </div>
</div>

<div id="town" class="screen" hidden>
  <div class="town-top"><span id="town-name"></span><span id="town-gold"></span></div>
  <button id="town-back" class="btn">직업 선택</button>
  <div class="town-tip">끌어서 걷기 · 사람 곁에서 말 걸기 · 길잡이에게 가면 사냥터로</div>
  <button id="talk" class="btn" hidden></button>
</div>

<div id="trade" hidden>
  <div id="trade-box">
    <div class="caption"><span id="trade-title"></span> <small id="trade-gold"></small></div>
    <div id="trade-rows"></div>
    <div class="row"><button id="close-trade" class="btn">닫기</button></div>
  </div>
</div>

<div id="over" class="screen" hidden>
  <div id="over-box">
    <div class="caption" id="over-title"></div>
    <div id="over-stats"></div>
    <div class="row"><button id="again" class="btn">다시 사냥</button><button id="to-select" class="btn">사냥터 선택</button></div>
  </div>
</div>

<div id="levelup" hidden>
  <div id="lv-box">
    <div class="caption" id="lv-title"></div>
    <div id="choices"></div>
    <div class="row lv-keys"><button id="lv-reroll" class="btn"></button><button id="lv-skip" class="btn"></button><button id="lv-banish" class="btn"></button><button id="lv-tree" class="btn">기술 트리</button></div>
  </div>
</div>

<div id="pause" hidden>
  <div id="pause-box">
    <div class="caption">메뉴</div>
    <div class="row"><button id="resume" class="btn">계속하기</button><button id="quit" class="btn">사냥터 나가기</button></div>
    <div class="row"><button id="open-equip" class="btn">장비</button><button id="open-sounds" class="btn">소리 맞추기</button><button id="open-tree" class="btn">기술 트리</button></div>
    <div class="row">
      <button id="opt-bgm" class="btn"></button>
      <button id="opt-sfx" class="btn"></button>
      <button id="opt-num" class="btn"></button>
      <button id="opt-bubble" class="btn"></button>
      <button id="opt-tiles" class="btn"></button>
    </div>
  </div>
</div>

<div id="play-frame" hidden>
  <div id="map-tab"><span id="map-name"></span><small id="boss-clock"></small></div>
  <div id="mini" hidden></div>
  <div id="keys"><button id="pause-btn">메뉴</button><button id="ult"><span></span><small></small></button></div>
  <button id="unfold" hidden>상태창</button>
  <div id="chat"></div>
  <div id="bossbar" hidden><b id="bb-name"></b><i><s id="bb-fill"></s></i><span id="bb-num"></span></div>
</div>
<div id="side" hidden><div id="panel">
  <div class="scroll"></div>
  <span class="lbl" style="top:62px">CLAN</span><span class="fld" style="left:86px;top:63px;width:152px" id="sd-clan"></span>
  <span class="lbl" style="top:85px">C. T.</span><span class="fld" style="left:86px;top:86px;width:152px" id="sd-ct"></span>
  <span class="lbl" style="top:108px">TITLE</span><span class="fld" style="left:86px;top:109px;width:152px" id="sd-title"></span>
  <span class="fld r" style="left:26px;top:136px;width:104px" id="sd-class"></span>
  <span class="fld r" style="left:134px;top:136px;width:104px" id="sd-name"></span>
  <div id="side-slots"></div>
  <div class="me"><img id="side-hero" alt=""></div>
  <div class="list" id="magic"></div>
  <div class="bar"><span>△</span><span>□</span><span>▽</span></div>
  <button class="fold" id="fold" aria-label="상태창 접기">접기</button>
  <div class="msg" id="vert"></div>
  <i class="em" style="top:500px"><img id="sd-face" alt=""></i>
  <i class="em coin" style="top:566px" id="sd-land"></i>
  <div class="row" style="top:496px"><span class="v" style="text-align:left" id="sd-me"></span><span class="lvbox" id="sd-cls1"></span><span class="lv" id="sd-lv"></span></div>
  <div class="row" style="top:516px"><span class="k">힘</span><span class="v" id="sd-str"></span><span class="k">지</span><span class="v" id="sd-int"></span><span class="k">민</span><span class="v" id="sd-dex"></span></div>
  <div class="row" style="top:536px"><span class="k">체력</span><div class="gauge hp" id="g-hp"><i></i><span></span></div></div>
  <div class="row" style="top:556px"><span class="k">마력</span><div class="gauge mp" id="g-mp"><i></i><span></span></div></div>
  <div class="row g" style="top:576px"><span class="k">경험</span><span class="v" id="sd-exp"></span></div>
  <div class="row" style="top:596px"><span class="k">전</span><span class="v" id="sd-gold"></span></div>
  <div class="row" style="top:616px;border:0"><span class="k">위치</span><span class="v" id="sd-pos"></span></div>
</div></div>
<div id="sounds" hidden>
  <div id="sounds-box">
    <div class="caption">소리 맞추기 <small>소리를 종류별로 나누면 마법마다 알맞은 종류에서 골라 씁니다.</small></div>
    <div id="sort" hidden>
      <div class="sort-head"><b id="sort-num"></b><span id="sort-left"></span><button id="sort-again" class="btn">다시 듣기</button></div>
      <div id="sort-kinds"></div>
      <div class="row"><button id="sort-done" class="btn">그만 나누기</button></div>
    </div>
    <div id="sound-rows"></div>
    <div class="row"><button id="start-sort" class="btn">빠르게 나누기</button><button id="close-sounds" class="btn">닫기</button></div>
  </div>
</div>
<div id="tree" hidden>
  <div id="tree-box">
    <div class="caption">기술 트리 <small id="tree-cls"></small></div>
    <div id="tree-rows"></div>
    <div class="row"><button id="close-tree" class="btn">닫기</button></div>
  </div>
</div>

<div id="equip" hidden>
  <div id="equip-box">
    <div class="caption">장비 <small>주운 장비 중에서 고르면 바로 입습니다.</small></div>
    <div id="equip-rows"></div>
    <div id="equip-stats"></div>
    <div class="row"><button id="close-equip" class="btn">닫기</button></div>
  </div>
</div>
<div id="banner" hidden></div>

<script type="module" src="js/game.js"></script>
</body>
</html>
