<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>바람 서바이버</title>
<style>
  /* Old-client look: square bevelled wooden panels, pixel type, no soft shadows or rounded corners. */
  @font-face { font-family: G11; src: url(fonts/Galmuri11.woff2) format('woff2'); }
  @font-face { font-family: G11; font-weight: 700; src: url(fonts/Galmuri11-Bold.woff2) format('woff2'); }
  @font-face { font-family: G9; src: url(fonts/Galmuri9.woff2) format('woff2'); }
  @font-face { font-family: G7; src: url(fonts/Galmuri7.woff2) format('woff2'); }
  :root {
    --panel: #2b1d12; --panel2: #3a2818; --hi: #a07a46; --mid: #5c4228; --lo: #0d0703;
    --text: #efe3c2; --dim: #b09c78; --gold: #ffe070; --red: #ff8a6a; --sky: #a8d0ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--text);
      font: 12px/1.5 G11, monospace; -webkit-font-smoothing: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  img { image-rendering: pixelated; }
  [hidden] { display: none !important; }

  .bevel, .btn, .card, .choice, #stage-info, #map, #pause-box, #lv-box, #over-box {
    background: var(--panel); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi);
    box-shadow: inset 1px 1px 0 var(--mid), inset -1px -1px 0 #1a1008; border-radius: 0;
  }
  .btn { padding: 6px 16px; font-weight: 700; font-size: 12px; background: var(--panel2); min-width: 112px; }
  .btn:active, .card:active, .choice:active, #pause-btn:active {
    border-color: var(--lo) var(--hi) var(--hi) var(--lo); box-shadow: inset 1px 1px 0 #1a1008; }
  .btn:disabled { color: #6e5e44; }
  .caption { margin: -2px -2px 8px; padding: 2px 8px; font-weight: 700; color: var(--gold);
      background: linear-gradient(#5a3a1c, #3a2410); border-bottom: 1px solid var(--lo); }

  .screen, #levelup, #pause, #loading { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px; padding: max(8px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .note { font: 10px/1.4 G9, monospace; color: var(--dim); text-shadow: 1px 1px 0 #000; }

  #loading .track { width: 200px; height: 10px; padding: 1px; background: var(--lo); border: 1px solid var(--hi); }
  #load-bar { height: 100%; width: 0; background: var(--gold); }

  #title h1 { margin: 0; font-size: 36px; line-height: 1.1; color: var(--gold); letter-spacing: 4px;
      text-shadow: 2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 3px 3px 0 #5a2a08; }
  #heroes { display: flex; gap: 18px; align-items: flex-end; height: 76px; }
  #heroes img { height: 70px; }

  #classes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: min(100%, 820px); }
  .card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; text-align: center; }
  .card .slot { display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 78px;
      background: #140c06; border: 1px solid; border-color: var(--lo) var(--mid) var(--mid) var(--lo); }
  .card .hero { height: 70px; }
  .card b { font-size: 14px; color: var(--gold); }
  .card span { font: 10px/1.4 G9, monospace; color: var(--text); min-height: 4.2em; }
  .card em { font-style: normal; font-size: 10px; font-family: G9; color: var(--sky); }
  .card small { font: 10px G9, monospace; color: var(--dim); }
  h2 { margin: 0; font-size: 14px; color: var(--gold); text-shadow: 1px 1px 0 #000; }

  .stage-wrap { display: flex; gap: 10px; align-items: stretch; justify-content: center; width: 100%; height: 100%; }
  .map-col { display: flex; flex-direction: column; gap: 4px; flex: none; }
  #map-tabs { display: flex; gap: 2px; }
  #map-tabs button { padding: 2px 10px; font-weight: 700; background: var(--panel); border: 1px solid var(--mid);
      color: var(--dim); }
  #map-tabs button.on { color: var(--gold); background: var(--panel2); border-color: var(--hi); }
  #map { position: relative; padding: 0; overflow: hidden; }
  #map img { display: block; height: calc(100vh - 52px); max-width: 56vw; object-fit: contain; }
  .pin { position: absolute; transform: translate(-50%, -100%); padding: 0; background: none; border: 0;
      display: flex; flex-direction: column; align-items: center; }
  .pin span { padding: 0 3px; font: 10px/13px G9, monospace; white-space: nowrap; color: var(--text);
      background: rgba(13, 7, 3, .82); border: 1px solid var(--mid); }
  .pin i { width: 0; height: 0; border: 5px solid transparent; border-top: 7px solid var(--gold); }
  .pin.cleared span { color: #b8f0a0; }
  .pin.locked span { color: #7a6a52; border-color: #3a2a1a; }
  .pin.locked i { border-top-color: #6a5a42; }
  .pin.on span { color: #000; background: var(--gold); border-color: #fff4c0; }
  .pin.on i { border-top-color: #fff4c0; }
  .info-col { display: flex; flex-direction: column; gap: 6px; width: min(300px, 42%); justify-content: center; }
  #stage-info { padding: 0 10px 8px; }
  #stage-info h3 { margin: 0; font-size: 16px; color: var(--gold); }
  #stage-info .lv { font: 10px G9, monospace; color: var(--red); }
  #stage-info p { margin: 4px 0; font: 10px/1.5 G9, monospace; }
  #stage-info .mons { display: flex; gap: 8px; align-items: flex-end; height: 58px; padding: 2px 6px;
      background: #140c06; border: 1px solid; border-color: var(--lo) var(--mid) var(--mid) var(--lo); }
  #stage-info .mons img { max-height: 54px; }
  #stage-info .boss { margin-top: 4px; }
  #stage-info .boss b { color: var(--red); }
  #stage-info .state { font: 10px G9, monospace; color: var(--dim); }
  #stage-info .state.done { color: #b8f0a0; }

  #levelup, #pause { background: rgba(0, 0, 0, .5); }
  #lv-box, #pause-box, #over-box { padding: 0 8px 8px; width: min(100%, 480px); }
  #choices { display: flex; flex-direction: column; gap: 4px; }
  .choice { display: flex; align-items: center; gap: 8px; padding: 4px 8px; text-align: left; background: var(--panel2); }
  .choice canvas, .choice .item { position: static; width: 40px; height: 40px; flex: none; object-fit: none;
      background: #140c06; border: 1px solid; border-color: var(--lo) var(--mid) var(--mid) var(--lo); }
  .choice b { font-size: 13px; color: var(--gold); }
  .choice i { font: normal 10px G9, monospace; color: var(--red); }
  .choice span { display: block; font: 10px/1.4 G9, monospace; }
  #pause-box .row { margin-top: 6px; }
  #over-stats { margin: 6px 0; text-align: center; line-height: 1.7; }

  /* ---- The old client's screen: a framed play area, a carved side panel, a parchment chat. ---- */
  :root { --side: clamp(176px, 27vw, 250px); --wood: #c18a4e; --wood-hi: #e2b679; --wood-lo: #5a3212;
    --field: #e6c992; --ink: #2a1606; --frame: #8a2c10; --frame-hi: #d8743a; --frame-lo: #2a0802; }
  /* A canvas keeps its drawing size unless told its box size outright. */
  body.hunting canvas#game { width: calc(100% - var(--side)); }
  #play-frame { position: fixed; top: 0; left: 0; bottom: 0; right: var(--side); pointer-events: none; z-index: 2;
      border: 5px solid; border-color: var(--frame-hi) var(--frame-lo) var(--frame-lo) var(--frame-hi);
      box-shadow: inset 0 0 0 2px var(--frame), inset 0 0 0 3px #000; }
  #map-tab { position: absolute; top: 0; left: 50%; transform: translateX(-50%); min-width: 120px; padding: 1px 14px 2px;
      text-align: center; font-weight: 700; color: #f4e6c4; background: #1e1008; border: 1px solid var(--frame-hi);
      border-top: 0; }
  #map-tab small { display: block; font: 10px G9, monospace; color: #ffb08a; }
  #chat { position: absolute; left: 3px; right: 3px; bottom: 3px; padding: 2px 6px; font: 10px/13px G9, monospace;
      color: var(--ink); background: #f0d9a8; border-top: 2px solid var(--frame-lo); max-height: 47px; overflow: hidden; }
  #chat p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat p.sys { color: #fff; background: #3e5cc0; margin: 0 -6px; padding: 0 6px; }
  #chat p.warn { color: #a01800; }

  #side { position: fixed; top: 0; right: 0; bottom: 0; width: var(--side); z-index: 3; display: flex; flex-direction: column;
      gap: 4px; padding: max(4px, env(safe-area-inset-top)) max(5px, env(safe-area-inset-right)) 5px 5px; color: var(--ink);
      background: var(--wood); border-left: 3px solid; border-color: var(--wood-hi);
      box-shadow: inset 2px 0 0 var(--wood-lo); }
  #side .field { padding: 0 5px; background: var(--field); border: 1px solid; border-color: var(--wood-lo) var(--wood-hi) var(--wood-hi) var(--wood-lo); }
  #side .head { display: flex; justify-content: space-between; font-weight: 700; }
  #side .doll { display: flex; align-items: center; gap: 4px; }
  #side .doll .me { flex: none; display: flex; align-items: flex-end; justify-content: center; width: 54px; height: 64px;
      background: #3a200c; border: 1px solid; border-color: var(--wood-lo) var(--wood-hi) var(--wood-hi) var(--wood-lo); }
  #side .doll .me img { max-width: 50px; max-height: 62px; }
  #side .slots { display: grid; grid-template-columns: repeat(4, 22px); gap: 2px; }
  #side .slots i { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; position: relative;
      background: #3a200c; border: 1px solid; border-color: var(--wood-lo) var(--wood-hi) var(--wood-hi) var(--wood-lo); }
  #side .slots i img { max-width: 20px; max-height: 20px; }
  #side .slots i b { position: absolute; right: 0; bottom: -2px; font: 8px G7, monospace; color: #fff; text-shadow: 1px 1px 0 #000; }
  #magic { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; align-content: start;
      column-gap: 6px; font: 10px/13px G9, monospace; }
  #magic span { white-space: nowrap; overflow: hidden; }
  #magic span b { font-weight: normal; color: #7a2a00; }
  #magic span.buff { grid-column: 1 / -1; color: #1a4aa0; }
  #stat { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 4px; align-items: center; font: 10px/12px G9, monospace;
      padding: 3px 5px; color: #f4e6c4; background: #3a200c;
      border: 1px solid; border-color: var(--wood-lo) var(--wood-hi) var(--wood-hi) var(--wood-lo); }
  #stat .g { height: 7px; background: #120a04; border: 1px solid #000; display: flex; gap: 1px; padding: 1px; }
  #stat .g i { flex: 1; }
  #stat .num { text-align: right; min-width: 52px; }
  #stat .hp i { background: #4a1208; } #stat .hp i.on { background: #e03a22; }
  #stat .mp i { background: #0e1a44; } #stat .mp i.on { background: #3a72e8; }
  #stat .ex i { background: #2a2008; } #stat .ex i.on { background: #d8b030; }
  #stat .k { color: #e6c992; }
  #side .keys { display: flex; gap: 4px; }
  #side .keys button { flex: 1; padding: 3px 0; font-weight: 700; color: var(--ink); background: var(--field);
      border: 2px solid; border-color: var(--wood-hi) var(--wood-lo) var(--wood-lo) var(--wood-hi); }
  #side .keys button:active { border-color: var(--wood-lo) var(--wood-hi) var(--wood-hi) var(--wood-lo); }
  #ult { flex: 2 !important; }
  #ult.ready { color: #7a1800 !important; background: #ffe9a0 !important; }
  #ult small { display: block; font: 8px G7, monospace; font-weight: normal; }
  #banner { position: fixed; top: 22%; left: calc((100% - var(--side)) / 2); transform: translateX(-50%); padding: 3px 14px;
      font-weight: 700; color: #ffe070; background: rgba(30, 16, 8, .9); border: 1px solid var(--frame-hi);
      pointer-events: none; white-space: nowrap; z-index: 4; }
  @media (max-height: 420px) {
    .card .slot { height: 58px; }
    .card .hero { height: 52px; }
    .card span { min-height: 0; }
    .choice canvas, .choice .item { width: 34px; height: 34px; }
  }
  @media (max-width: 560px) { #classes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="loading"><div class="note">불러오는 중</div><div class="track"><div id="load-bar"></div></div></div>

<div id="title" class="screen" hidden>
  <div id="heroes"></div>
  <h1>바람 서바이버</h1>
  <div class="note">몰려오는 몬스터를 버티며 사냥터를 정복하라</div>
  <button id="start-btn" class="btn">시작</button>
  <div class="note">손가락으로 끌어 이동 · 마법은 저절로 나간다 · 마력이 차면 필살기</div>
</div>

<div id="select" class="screen" hidden>
  <h2>직업 선택</h2>
  <div id="classes"></div>
  <button id="back-title" class="btn">뒤로</button>
</div>

<div id="stages" class="screen" hidden>
  <div class="stage-wrap">
    <div class="map-col">
      <div id="map-tabs"><button data-map="world_1">대륙</button><button data-map="world_4">환상의 섬</button></div>
      <div id="map"></div>
    </div>
    <div class="info-col">
      <div id="stage-info"></div>
      <div class="row"><button id="back-select" class="btn">직업 선택</button><button id="go" class="btn"></button></div>
    </div>
  </div>
</div>

<div id="over" class="screen" hidden>
  <div id="over-box">
    <div class="caption" id="over-title"></div>
    <div id="over-stats"></div>
    <div class="row"><button id="again" class="btn">다시 사냥</button><button id="to-select" class="btn">사냥터 선택</button></div>
  </div>
</div>

<div id="levelup" hidden>
  <div id="lv-box">
    <div class="caption" id="lv-title"></div>
    <div id="choices"></div>
  </div>
</div>

<div id="pause" hidden>
  <div id="pause-box">
    <div class="caption">메뉴</div>
    <div class="row"><button id="resume" class="btn">계속하기</button><button id="quit" class="btn">사냥터 나가기</button></div>
    <div class="row">
      <button id="opt-bgm" class="btn"></button>
      <button id="opt-sfx" class="btn"></button>
      <button id="opt-num" class="btn"></button>
    </div>
  </div>
</div>

<div id="play-frame" hidden>
  <div id="map-tab"><span id="map-name"></span><small id="boss-clock"></small></div>
  <div id="chat"></div>
</div>
<div id="side" hidden>
  <div class="head field"><span id="side-class"></span><span id="side-lv"></span></div>
  <div class="doll"><div class="me"><img id="side-hero" alt=""></div><div class="slots" id="side-slots"></div></div>
  <div id="magic" class="field"></div>
  <div id="stat">
    <span class="k">체력</span><div class="g hp"></div><span class="num" id="st-hp"></span>
    <span class="k">마력</span><div class="g mp"></div><span class="num" id="st-mp"></span>
    <span class="k">경험</span><div class="g ex"></div><span class="num" id="st-ex"></span>
    <span class="k">시간</span><span id="st-time"></span><span class="num" id="st-gold"></span>
  </div>
  <div class="keys"><button id="pause-btn">메뉴</button><button id="ult"><span></span><small></small></button></div>
</div>
<div id="banner" hidden></div>

<script type="module" src="js/game.js"></script>
</body>
</html>
